# ── JVM ────────────────────────────────────────────────
org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# ── AndroidX / Kotlin ──────────────────────────────────
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# ── 版本号（单一来源，由发布脚本读取）──────────────────
# 约定：versionCode 每个里程碑 +1；versionName 带里程碑后缀，便于在设备上
# 一眼分辨装的是哪一版（设置页「版本」行读的就是它）。
#
# ⚠️ 必须在这里改，**不要**用 `./gradlew -Pmimi.versionCode=…` 临时覆盖来出发布包：
# 命令行 -P 只影响这一次构建，`gradle.properties` 才是 `publish-update.sh` 生成
# manifest 时读的那个事实源。两者不一致的后果是"APK 是新的、清单声明的版本是旧的"，
# 客户端据此认为**没有更新** —— 服务端 200、客户端正常、就是没人升得上去，
# 而且没有任何报错。M5.1 发布前的 dry-run 正是靠比对这两处才抓到它。
mimi.versionCode=33
mimi.versionName=0.7.21-M7.19
